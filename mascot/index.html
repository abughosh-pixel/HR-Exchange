<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102454"><title>HR Exchange | Fine</title>
<style>
:root{--navy:#102454;--ink:#14234a;--cream:#f7f4ed;--teal:#55bab2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.page{min-height:100svh;overflow:hidden;position:relative;padding:clamp(1rem,3vw,2.25rem) clamp(1rem,5vw,4.5rem) 1.8rem;background:radial-gradient(circle at 50% 48%,#fff 0,#f7f4ed 57%,#e7efed 100%)}.page::before{content:"";position:absolute;width:45rem;height:45rem;top:-31rem;left:-19rem;border:1px solid rgba(85,186,178,.28);border-radius:50%;box-shadow:0 0 0 44px rgba(85,186,178,.06),0 0 0 88px rgba(85,186,178,.028)}header{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;max-width:1320px;margin:auto}.brand img{display:block;width:188px}.header-copy{font-size:.8rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#69758e}.intro{position:relative;z-index:3;max-width:1320px;margin:clamp(1.5rem,4vw,3.4rem) auto 0}.eyebrow{margin:0 0 .45rem;color:#4ca9a1;font-size:.74rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(2.1rem,4.25vw,4rem);letter-spacing:-.07em;line-height:.95}.intro p:last-child{margin:.75rem 0 0;color:#6a758c;font-size:1rem}
.stage{position:relative;max-width:1120px;height:min(610px,65svh);min-height:490px;margin:0 auto}.orbit{position:absolute;left:50%;top:51%;width:min(41vw,450px);height:min(41vw,450px);border:1px dashed rgba(85,186,178,.42);border-radius:50%;transform:translate(-50%,-50%);animation:spin 25s linear infinite}.orbit::after{content:"";position:absolute;width:12px;height:12px;right:12%;top:1%;border-radius:50%;background:var(--teal);box-shadow:0 0 0 7px rgba(85,186,178,.15)}.ghost{position:absolute;z-index:0;left:50%;top:48%;font-family:Georgia,"Times New Roman",serif;font-size:clamp(15rem,34vw,31rem);font-weight:600;letter-spacing:-.12em;line-height:.7;color:rgba(16,36,84,.045);transform:translate(-50%,-50%);user-select:none}.mascot-wrap{--x:0px;--y:0px;--tilt:0deg;position:absolute;z-index:2;left:50%;top:53%;width:min(32vw,370px);min-width:220px;aspect-ratio:1/1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--tilt));transform-origin:50% 90%;transition:transform .45s cubic-bezier(.2,.9,.24,1.15);filter:drop-shadow(0 24px 18px rgba(16,36,84,.15))}.mascot-wrap::after{content:"";position:absolute;left:14%;bottom:7%;width:72%;height:8%;border-radius:50%;background:rgba(16,36,84,.13);filter:blur(10px);z-index:-1}.mascot{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:translateY(5px);transition:opacity .3s ease,transform .42s ease}.mascot.front{opacity:1}.mascot-wrap[data-pose="left"] .left,.mascot-wrap[data-pose="right"] .right,.mascot-wrap[data-pose="up"] .up,.mascot-wrap[data-pose="down"] .down{opacity:1;transform:none}.mascot-wrap[data-pose="left"] .front,.mascot-wrap[data-pose="right"] .front,.mascot-wrap[data-pose="up"] .front,.mascot-wrap[data-pose="down"] .front{opacity:0}
.focus{position:absolute;z-index:4;max-width:310px;padding:0;border:0;color:var(--ink);background:transparent;text-align:left;cursor:pointer}.focus:focus-visible{outline:2px solid var(--teal);outline-offset:8px}.focus small{display:block;color:#4eaaa2;font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.focus strong{display:block;margin:.45rem 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.35rem,2.35vw,2.1rem);font-weight:500;line-height:1;letter-spacing:-.06em}.focus span{font-size:.84rem;font-weight:750;color:#586681}.focus::after{content:"";display:block;width:3rem;height:3px;margin-top:.8rem;background:var(--teal)}.focus[data-dir="left"]{left:2%;top:45%;text-align:right}.focus[data-dir="left"]::after{margin-left:auto}.focus[data-dir="right"]{right:2%;top:45%}.focus[data-dir="up"]{left:50%;top:7%;width:360px;max-width:42%;text-align:center;transform:translateX(-50%)}.focus[data-dir="up"]::after{margin-inline:auto}.focus[data-dir="down"]{left:50%;bottom:1%;width:360px;max-width:42%;text-align:center;transform:translateX(-50%)}.focus[data-dir="down"]::after{margin-inline:auto}.focus.run[data-dir="left"]{animation:fly-left .55s cubic-bezier(.2,.9,.24,1.1)}.focus.run[data-dir="right"]{animation:fly-right .55s cubic-bezier(.2,.9,.24,1.1)}.focus.run[data-dir="up"]{animation:fly-up .55s cubic-bezier(.2,.9,.24,1.1)}.focus.run[data-dir="down"]{animation:fly-down .55s cubic-bezier(.2,.9,.24,1.1)}.gaze{position:absolute;z-index:1;height:2px;background:linear-gradient(90deg,rgba(85,186,178,.04),var(--teal));transform-origin:left}.gaze::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 6px rgba(85,186,178,.14)}.gaze[data-dir="left"]{left:28%;top:54%;width:15%;transform:rotate(178deg)}.gaze[data-dir="right"]{left:57%;top:50%;width:17%;transform:rotate(-11deg)}.gaze[data-dir="up"]{left:52%;top:35%;width:15%;transform:rotate(-96deg)}.gaze[data-dir="down"]{left:50%;top:62%;width:14%;transform:rotate(86deg)}
.controls{position:relative;z-index:4;display:flex;justify-content:center;align-items:center;gap:.75rem;max-width:1120px;margin:-.3rem auto 0}.nav-button{display:grid;place-items:center;width:2.8rem;height:2.8rem;border:1px solid #d3dce1;border-radius:50%;color:var(--navy);background:#fff;cursor:pointer;font-size:1.25rem;transition:background .2s,color .2s}.nav-button:hover,.nav-button:focus-visible{outline:none;color:#fff;background:var(--navy)}.dots{display:flex;gap:.34rem}.dot{width:.58rem;height:.58rem;padding:0;border:0;border-radius:50%;background:#ccd7d8;cursor:pointer}.dot[aria-pressed="true"]{width:1.55rem;border-radius:999px;background:var(--teal)}.instruction{margin:.8rem 0 0;text-align:center;color:#738097;font-size:.83rem}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes fly-left{from{opacity:0;transform:translateX(-65px)}to{opacity:1;transform:translateX(0)}}@keyframes fly-right{from{opacity:0;transform:translateX(65px)}to{opacity:1;transform:translateX(0)}}@keyframes fly-up{from{opacity:0;transform:translate(-50%,55px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes fly-down{from{opacity:0;transform:translate(-50%,-55px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:760px){.page{padding:1rem 1rem 1.5rem}.brand img{width:142px}.header-copy{display:none}.intro{margin:1.5rem 0 0}.intro p:last-child{font-size:.92rem}.stage{height:600px;min-height:0}.orbit{width:250px;height:250px}.ghost{font-size:17rem}.mascot-wrap{top:53%;width:155px;min-width:0}.focus{max-width:31%}.focus small{font-size:.57rem}.focus strong{font-size:.98rem;line-height:1.05}.focus span{font-size:.7rem;line-height:1.2}.focus::after{width:1.8rem;margin-top:.5rem}.focus[data-dir="left"]{left:0;top:42%}.focus[data-dir="right"]{right:0;top:42%}.focus[data-dir="up"]{top:5%;width:76%;max-width:none}.focus[data-dir="down"]{bottom:3%;width:76%;max-width:none}.gaze{display:none}.controls{margin:0}.instruction{font-size:.78rem}}
</style>
</head>
<body><div class="page"><header><div class="brand"><img src="../assets/fine-logo.png" alt="Fine Hygienic Holding"></div><div class="header-copy">HR Exchange · Learning Bites</div></header><section class="intro"><p class="eyebrow">Fine HR Exchange</p><h1>Follow the<br>learning.</h1><p>Use the arrows or dots to move through the Learning Bites.</p></section><main class="stage"><div class="ghost" id="ghost">01</div><div class="orbit"></div><div class="gaze" id="gaze" data-dir="left"></div><button class="focus" id="focus" data-dir="left" type="button" aria-label="Move to the next Learning Bite"></button><div class="mascot-wrap" id="mascot" data-pose="right" aria-hidden="true"><img class="mascot front" src="assets/mascot-front.webp" alt=""><img class="mascot left" src="assets/mascot-left.webp" alt=""><img class="mascot up" src="assets/mascot-up.webp" alt=""><img class="mascot right" src="assets/mascot-right.webp" alt=""><img class="mascot down" src="assets/mascot-down.webp" alt=""></div></main><div class="controls"><button id="previous" class="nav-button" aria-label="Previous Learning Bite">←</button><div id="dots" class="dots" aria-label="Learning Bite navigation"></div><button id="next" class="nav-button" aria-label="Next Learning Bite">→</button></div><p class="instruction">Tap the session title or use the navigation to continue.</p></div>
<script>
const sessions=[['The True Role of HR','Dima Haddadin','right','left'],['Creating an Outstanding Employee & Candidate Experience','Tamara Marar','left','right'],['Measuring Success','Fadi Aranki','up','up'],['Understanding Our Reward Framework','Fadi Aranki','down','down'],['The Art of Recruitment','Tamara Marar','right','left'],['Meet Our New AI Agent','Nadi Khleif','left','right'],['Performance Management Done Right','Tamara Ajlouni','up','up'],['Oracle HCM Hands-On','Majed M. Alshomali','down','down']];
const mascot=document.getElementById('mascot'),focus=document.getElementById('focus'),gaze=document.getElementById('gaze'),ghost=document.getElementById('ghost'),dots=document.getElementById('dots');let current=0;function choose(i){current=(i+sessions.length)%sessions.length;const [title,facilitator,pose,dir]=sessions[current],motion={left:['-17px','3px','-8deg'],right:['17px','3px','8deg'],up:['0px','-16px','0deg'],down:['0px','16px','0deg']}[dir];mascot.dataset.pose=pose;mascot.style.setProperty('--x',motion[0]);mascot.style.setProperty('--y',motion[1]);mascot.style.setProperty('--tilt',motion[2]);focus.dataset.dir=dir;gaze.dataset.dir=dir;focus.innerHTML=`<small>Learning Bite ${String(current+1).padStart(2,'0')}</small><strong>${title}</strong><span>Facilitator: ${facilitator}</span>`;ghost.textContent=String(current+1).padStart(2,'0');focus.classList.remove('run');void focus.offsetWidth;focus.classList.add('run');dots.querySelectorAll('button').forEach((b,n)=>b.setAttribute('aria-pressed',String(n===current)))}for(let i=0;i<sessions.length;i++){const b=document.createElement('button');b.className='dot';b.type='button';b.setAttribute('aria-label',`Learning Bite ${i+1}`);b.addEventListener('click',()=>choose(i));dots.appendChild(b)}document.getElementById('previous').addEventListener('click',()=>choose(current-1));document.getElementById('next').addEventListener('click',()=>choose(current+1));focus.addEventListener('click',()=>choose(current+1));choose(0);
</script></body></html>
